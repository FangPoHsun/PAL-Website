    function formatAuthor(a) {
        const comma = a.indexOf(', ');
        if (comma === -1) return a;
        const last = a.substring(0, comma);
        const first = a.substring(comma + 2);
        const initials = first.split(/[-\s]+/).map(p => p[0].toUpperCase()).join('');
        return initials + ' ' + last;
    }

    function formatAuthorList(authors) {
        return authors.map(formatAuthor).join(', ');
    }

    function getVenue(pub) {
        let parts = [];
        if (pub.journal)    parts.push(pub.journal);
        if (pub.booktitle)  parts.push(pub.booktitle);
        if (pub.volume)     parts.push(pub.volume);
        if (pub.number)     parts.push('(' + pub.number + ')');
        if (pub.pages)      parts.push(pub.pages.replace(/--/g, '–'));
        if (pub.doi)        parts.push('doi: ' + pub.doi);
        // join: venue, vol (num), pages — use comma between all
        let venue = '';
        if (pub.journal || pub.booktitle) {
            venue = (pub.journal || pub.booktitle);
            const extras = [];
            if (pub.volume) extras.push(pub.volume);
            if (pub.number) extras.push('(' + pub.number + ')');
            if (pub.pages)  extras.push(pub.pages.replace(/--/g, '–'));
            if (pub.doi)    extras.push('doi: ' + pub.doi);
            if (extras.length) venue += ' ' + extras.join(', ');
        }
        return venue;
    }

function getScholarUrl(pub) {
        if (pub.scholar) return pub.scholar;
        return 'https://scholar.google.com/scholar?q=' + encodeURIComponent(pub.title);
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

function renderGroup(pubs) {
        return pubs.map(pub => {
            const scholarUrl = getScholarUrl(pub);
            return `
            <div class="pub-item">
              <div class="pub-content">
                <a href="${scholarUrl}" target="_blank" rel="noopener" class="pub-title">${pub.title}</a>
                <div class="pub-authors">${formatAuthorList(pub.author)}</div>
                <div class="pub-journal">${escapeHtml(getVenue(pub))}</div>
              </div>
            </div>`;
        }).join('');
    }

    function renderPublications() {
        const byYear = {};
        for (const pub of PUBLICATIONS) {
            if (!byYear[pub.year]) byYear[pub.year] = [];
            byYear[pub.year].push(pub);
        }

        const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

        let html = '';
        for (const year of years) {
            const journals     = byYear[year].filter(p => p.type === 'article');
            const conferences  = byYear[year].filter(p => p.type !== 'article');

            html += '<div class="year-section fade-in">';
            html += '<h3 class="year-header">' + year + '</h3>';

            if (journals.length) {
                html += '<h4 class="type-header">Journal Papers</h4>';
                html += renderGroup(journals);
            }
            if (conferences.length) {
                html += '<h4 class="type-header">Conference Papers</h4>';
                html += renderGroup(conferences);
            }

            html += '</div>';
        }

        document.getElementById('pub-root').innerHTML = html;
    }

    renderPublications();
    </script>
