name: Update publications from OpenAlex

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC (11:00 Taiwan time)
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check OpenAlex for new publications
        run: node scripts/update-publications.mjs

      - name: Open pull request if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: data/publications.json
          branch: auto/update-publications
          delete-branch: true
          title: 'New publications detected on OpenAlex'
          body-path: scripts/.pr-body.md
          commit-message: 'Add new publications detected on OpenAlex'
          labels: publications
